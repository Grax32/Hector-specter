<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hector Specter - Musician & Producer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Hector Specter</h1>
            <p class="tagline">Musician & Music Producer</p>
        </div>
    </header>

    <main class="container">
        <!-- Featured Section -->
        <section id="featured" class="featured">
            <h2>Latest Release</h2>
            <div id="featured-content" class="featured-content">
                <p>Loading...</p>
            </div>
        </section>

        <!-- Albums Section -->
        <section id="albums" class="albums">
            <h2>Albums</h2>
            <div id="albums-list" class="albums-list">
                <p>Loading albums...</p>
            </div>
        </section>

        <!-- Songs Section -->
        <section id="songs" class="songs">
            <h2>Latest Songs</h2>
            <div id="songs-list" class="songs-list">
                <p>Loading songs...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Hector Specter. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
