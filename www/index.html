<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Hector Specter -- Musician & Music Producer</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Hector Specter – Musician & Music Producer">
    <meta property="og:description"
        content="Official site of Hector Specter. Electronic polka, cinematic instrumentals, and special releases.">
    <meta property="og:url" content="https://hectorspecter.com/">
    <meta property="og:image" content="https://hectorspecter.com/preview.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Hector Specter – Musician & Music Producer">
    <meta name="twitter:description"
        content="Official site of Hector Specter. Electronic polka, cinematic instrumentals, and special releases.">
    <meta name="twitter:image" content="https://hectorspecter.com/preview.jpg">
</head>

<body>
    <header>
        <div class="container">
            <div class="artist-media">
                <video id="artist-video" class="artist-video" autoplay muted playsinline preload="metadata"
                    poster="/artist/hector-specter.png">
                    <source src="/artist/hector-specter.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <h1>Hector Specter</h1>
            <p class="tagline">Musician & Music Producer</p>
        </div>
    </header>

    <main class="container">
        <section id="album-page" class="album-page" hidden>
            <button type="button" id="album-page-back" class="album-page-back">Back to Music Library</button>
            <div class="album-page-hero">
                <img id="album-page-artwork" class="album-page-artwork" alt="Album artwork">
                <div class="album-page-headline">
                    <p class="album-page-kicker">Album</p>
                    <h2 id="album-page-title"></h2>
                    <p id="album-page-subtitle" class="album-page-subtitle"></p>
                    <div id="album-page-media" class="album-page-media"></div>
                </div>
            </div>
            <div id="album-page-songs" class="library-grid album-page-songs"></div>
        </section>

        <!-- Featured Section -->
        <section id="featured" class="featured">
            <h2>Latest Release</h2>
            <div id="featured-content" class="featured-content">
                <p>Loading...</p>
            </div>
        </section>

        <section id="library" class="library">
            <h2>Music Library</h2>
            <div class="library-controls">
                <div class="library-nav" role="tablist" aria-label="Library type filters">
                    <button type="button" class="library-tab is-active" data-type-filter="all">All</button>
                    <button type="button" class="library-tab" data-type-filter="album">Albums</button>
                    <button type="button" class="library-tab" data-type-filter="single">Singles</button>
                </div>
                <label class="library-search-wrap" for="library-search">
                    <span class="library-search-label">Filter</span>
                    <input id="library-search" class="library-search" type="search"
                        placeholder="Type to filter albums or singles" autocomplete="off">
                </label>
            </div>
            <div id="library-results" class="library-grid">
                <p>Loading library...</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Hector Specter. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
